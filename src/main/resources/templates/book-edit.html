<!doctype html>
<html xmlns:th="http://thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Add New Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <main class="p-5 text-center" style="min-height: 75vh;">
        <div class="d-flex flex-column align-items-center my-3 mx-auto border border-dark shadow p-5 w-75">

            <div class="text-danger py-1 px-2 w-100 text-center mb-2" th:if="${errorMessage}">
                <p th:text="${errorMessage}" class="mb-0"></p>
            </div>

            <form class="w-75"

                method="post"
                  th:action="@{/books/edit}"
                  th:object="${bookEditDTO}">

                <input type="hidden" th:field="*{uuid}" />

                <div class="row g-5">
                    <div class="col-lg-6">
                        <div class="d-flex flex-column text-center">
                            <label th:for="*{title}" class="form-label fs-5 mb-1">Title:
                            </label>
                            <input th:field="*{title}" type="text" class="form-control">
                            <div th:if="${#fields.hasErrors('title')}">
                                <p th:errors="*{title}" class="text-danger small mb-0 py-1"></p>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="d-flex flex-column text-center">
                            <label th:for="*{authorName}" class="form-label fs-5 mb-1">Author Name:
                            </label>
                            <input th:field="*{authorName}" type="text" class="form-control">
                            <div th:if="${#fields.hasErrors('authorName')}">
                                <p th:errors="*{authorName}" class="text-danger small mb-0 py-1"></p>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="d-flex flex-column text-center">
                            <label th:for="*{isbn}" class="form-label fs-5 mb-1">ISBN:
                            </label>
                            <input th:field="*{isbn}" type="text" class="form-control">
                            <div th:if="${#fields.hasErrors('isbn')}">
                                <p th:errors="*{isbn}" class="text-danger small mb-0 py-1"></p>
                            </div>
                        </div>
                    </div>

                    <div class="col-lg-6">
                        <div class="d-flex flex-column text-center">
                            <label th:for="*{categoryId}" class="form-label fs-5 mb-1">Category:
                            </label>
                            <select th:field="*{categoryId}" class="form-select">
                                <option value="" selected>Select Category</option>
                                <option th:each="category : ${categoriesReadOnlyDTO}"
                                        th:value="${category.id}"
                                        th:text="${category.name}"
                                        th:selected="${category.id == bookEditDTO.categoryId}">
                                </option>
                            </select>

                            <div th:if="${#fields.hasErrors('categoryId')}">
                                <p th:errors="*{categoryId}" class="text-danger small mb-0 py-1"></p>
                            </div>
                        </div>
                    </div>

                    <div class="col-12 mt-5">
                        <button type="submit" class="btn btn-success text-white px-4 fs-4">Submit</button>
                    </div>

                </div>
            </form>
        </div>
    </main>

    <div th:replace="~{fragments/footer :: footerFragment}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
