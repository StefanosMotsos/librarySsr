<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Central Service - Steve's Archive</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/header :: headerFragment}"></div>

<div class="container d-flex flex-column align-items-center justify-content-center" style="min-height: 70vh;">
    <div th:if="${param.logout}" class="alert alert-success mx-auto" style="max-width: 448px;">
        You have been logged out successfully.
    </div>
    <div th:if="${param.error}" class="mx-auto" style="max-width: 448px;">
        <p class="alert alert-danger">Invalid username or password</p>
    </div>
    <form th:action="@{/login}" method="POST"
          class="w-100 bg-white p-4 rounded shadow mx-auto" style="max-width: 448px;">

        <div class="mb-3 text-center">
            <h2 class="fw-bold">Sign in</h2>
            <p class="text-muted mt-2">Access your account</p>
        </div>

        <div class="mb-3 text-center">
            <label for="username" class="form-label">Username:</label>
            <input type="text" id="username" name="username" placeholder="Enter your username" autofocus required class="form-control">
        </div>

        <div class="mb-3 text-center">
            <label for="password" class="form-label">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter your password" required class="form-control">
        </div>

        <button type="submit" class="btn btn-success w-100">
            Sign In
        </button>

        <div class="mt-2 text-center">
            <a href="" class="text-primary text-decoration-none">Forgot password?</a>
        </div>
    </form>

    <div th:if="${param.disabled}" class="alert alert-danger">
        Your account is disabled
    </div>
</div>

<div th:replace="~{fragments/footer :: footerFragment}"></div>

<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
