<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create New User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body>

<div th:replace="~{fragments/header :: headerFragment}"></div>

<div class="container mt-5" style="min-height: 70vh;">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm">
                <div class="card-header bg-primary text-white">
                    <h2 class="card-title mb-0">Create New User</h2>
                </div>

                <div th:if="${errorMessage}" class="text-danger px-3 pt-3">
                    <p th:text="${errorMessage}"></p>
                </div>

                <div class="card-body">
                    <form method="post"
                          th:object="${userInsertDTO}"
                          th:action="@{/users/register}">

                        <div class="mb-3">
                            <label th:for="username" class="form-label">Username</label>
                            <input type="text" class="form-control" th:field="*{username}" required>
                            <div th:if="${#fields.hasErrors('username')}">
                                <p th:errors="*{username}" class="text-danger small mb-0 py-1"></p>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label th:for="password" class="form-label">Password</label>
                            <input type="password" class="form-control" th:field="*{password}" required>
                            <div th:if="${#fields.hasErrors('password')}">
                                <p th:errors="*{password}" class="text-danger small mb-0 py-1">></p>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="role" class="form-label">Role</label>
                            <select class="form-select" th:field="*{roleId}" id="role" required>
                                <option th:each="role : ${roles}"
                                        th:value="{role.id}"
                                        th:text="{role.name}">
                                </option>
                            </select>
                        </div>

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">Create User</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:replace="~{fragments/footer :: footerFragment}"></div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
