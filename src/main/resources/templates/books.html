<!DOCTYPE html>
<html  xmlns:th="http://www.thymeleaf.org"
       xmlns:sec="http://www.thymeleaf.org/extras/springsecurity">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

    <div th:replace="~{fragments/header :: headerFragment}"></div>

    <div class="p-5 text-center" style="min-height: 75vh;">
        <h1 class="text-center my-4 text-success">Book List</h1>

        <form method="get" th:action="@{/books}" class="mb-4 mx-auto" style="max-width: 500px;">
            <div class="input-group">
                <input type="text"
                       name="search"
                       th:value="${search}"
                       class="form-control border-success"
                       placeholder="Search by title...">

                <button class="btn btn-success" type="submit">
                    <i class="bi bi-search"></i> Search
                </button>

                <a th:href="@{/books}" class="btn btn-outline-secondary">
                    Clear
                </a>
            </div>
        </form>

        <div sec:authorize="hasAuthority('INSERT_BOOK')" class="mb-3 d-flex justify-content-end mx-auto">
            <a th:href="@{/books/insert}" class="btn btn-success">
                <i class="bi bi-plus-circle"></i> Insert Book
            </a>
        </div>

        <div th:if="${errorMessage}" class="text-danger py-1 px-2 w-100 text-center mb-2">
            <p th:text="${errorMessage}"></p>
        </div>

        <table class="mt-5 border border-black" style="width: 95vw;" sec:authorize="hasAuthority('VIEW_BOOKS')">
            <thead class="bg-success text-white border border-black">
            <tr>
                <th class="border-end border-black">UUID</th>
                <th class="border-end border-black">Title</th>
                <th class="border-end border-black">Author</th>
                <th class="border-end border-black">ISBN</th>
                <th class="border-end border-black">Publication Year</th>
                <th class="border-end border-black">Category</th>
                <th class="border-end border-black" sec:authorize="hasAuthority('EDIT_BOOKS') or hasAuthority('DELETE_BOOKS')">Actions</th>
            </tr>
            </thead>

            <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.uuid()}"></td>
                <td th:text="${book.title()}"></td>
                <td th:text="${book.author()}"></td>
                <td th:text="${book.isbn()}"></td>
                <td th:text="${book.publicationYear()}"></td>
                <td th:text="${book.category()}"></td>
                <td sec:authorize="hasAuthority('EDIT_BOOKS') or hasAuthority('DELETE_BOOKS')">
                    <a th:href="@{/books/edit/{uuid}(uuid=${book.uuid})}" class="btn btn-sm btn-outline-success">Edit</a>
                    <form th:action="@{/books/delete/{uuid}(uuid=${book.uuid})}"
                          method="post"
                          class="d-inline"
                          onsubmit="return confirm('Delete?')">
                        <button class="btn btn-sm btn-outline-danger">Delete</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
    </div>

    <div class="w-75 my-3 mx-auto text-center">
        <a th:if="${!page.first}" th:href="@{/books(page=0, size=${page.size})}">&laquo; First</a>
        <span th:if="${page.first}">&laquo; First</span>

        <a th:if="${!page.first}" th:href="@{/books(page=${page.number - 1}, size=${page.size})}">&lsaquo; Prev</a>
        <span th:if="${page.first}">&lsaquo; Prev</span>

        <span  th:text="${page.number + 1} + ' / ' + ${page.totalPages}"></span>

        <a th:if="${!page.last}" th:href="@{/books(page=${page.number + 1}, size=${page.size})}">Next &rsaquo;</a>
        <span th:if="${page.last}">Next &rsaquo;</span>

        <a th:if="${!page.last}" th:href="@{/books(page=${page.totalPages - 1}, size=${page.size})}">Last &raquo;</a>
        <span th:if="${page.last}">Last &raquo;</span>
    </div>

    <div th:replace="~{fragments/footer :: footerFragment}"></div>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
